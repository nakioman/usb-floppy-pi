PACKAGE_NAME="g-floppy"
PACKAGE_VERSION="0.1.0"

# Two modules: the function (usb_f_floppy) registered as "floppy" via the
# composite framework, and the legacy single-purpose gadget (g_floppy) that
# requests the function instance at bind time.
#
# `modprobe g_floppy` triggers depmod to auto-load usb_f_floppy first because
# of the MODULE_SOFTDEP / depends entries baked into the .ko at build time.

BUILT_MODULE_NAME[0]="usb_f_floppy"
BUILT_MODULE_LOCATION[0]="."
DEST_MODULE_LOCATION[0]="/extra"

BUILT_MODULE_NAME[1]="g_floppy"
BUILT_MODULE_LOCATION[1]="."
DEST_MODULE_LOCATION[1]="/extra"

MAKE[0]="make KDIR=/lib/modules/${kernelver}/build"
CLEAN="make clean"

# Rebuild + reinstall automatically on every apt-installed kernel update.
AUTOINSTALL="yes"

# g_floppy module parameters at boot.
#
# `file=` points at a symlink that ALWAYS resolves to a valid 1.44MB
# image — initially blank.img (a pre-formatted empty FAT12), then updated
# by the Python service whenever the user mounts/ejects. This guarantees
# the kernel always loads with media attached, which is necessary for
# Windows to classify the device as Floppy Disk Drive on the first
# enumeration (otherwise it falls back to "USB removable drive").
#
# stall=0 and removable=1: required for Windows compatibility (see
# Phase 1 deploy notes — "Code 10" without these).
#
# speed_preset=floppy-real: ~50 KB/s read, ~30 KB/s write, 6ms seek.
# Override via /etc/usb-floppy-pi/config.json (applied by the Python
# service at startup) or runtime via the web UI.
options g_floppy file=/var/lib/usb-floppy-pi/current.img stall=0 removable=1 speed_preset=floppy-real
